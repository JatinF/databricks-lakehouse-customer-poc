name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,spark]"
      - run: ruff check src tests scripts pipelines notebooks
      - run: mypy
      - run: python -m pytest

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t databricks-lakehouse-customer-poc:ci .
      - run: docker compose config
